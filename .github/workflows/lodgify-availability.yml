name: Lodgify occupancy

on:
  schedule:
    # ~06:00 and 18:00 Europe/Rome (UTC+1/+2)
    - cron: '0 5,17 * * *'
  workflow_dispatch:

concurrency:
  group: lodgify-occupancy
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      deploy: ${{ steps.commit.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Sync occupancy snapshot
        env:
          LODGIFY_API_KEY: ${{ secrets.LODGIFY_API_KEY }}
        run: npm run lodgify:sync

      - name: Detect occupancy change
        id: diff
        run: |
          git add src/lib/data/availability.json
          if git diff --cached --quiet; then
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'Occupancy unchanged; skipping commit and deploy.'
          else
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Keep schedule alive
        if: steps.diff.outputs.deploy == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/lodgify-availability.yml/enable"

      - name: Typecheck
        if: steps.diff.outputs.deploy == 'true'
        run: npm run check

      - name: Unit tests
        if: steps.diff.outputs.deploy == 'true'
        run: npm test

      - name: Build
        if: steps.diff.outputs.deploy == 'true'
        run: npm run build

      - name: Assert prerendered output
        if: steps.diff.outputs.deploy == 'true'
        run: npm run test:build

      - name: Commit snapshot
        id: commit
        if: steps.diff.outputs.deploy == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$(cat <<'EOF'
          Update Lodgify occupancy snapshot

          EOF
          )"
          git push

      - name: Upload Pages artifact
        if: steps.diff.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: snapshot
    if: needs.snapshot.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-main
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
