# yaml-language-server: $schema=../../node_modules/@sveltia/cms/schema/sveltia-cms.json
#
# Live /admin/ → Sign in with GitHub via https://auth.tientjeketama.nl
# (iac ALLOWED_DOMAINS includes this host). Local: Local Repository.
# Do not put /admin in the public nav. No client secret in this repo.
#
# Do not enable Sveltia i18n. Its single_file layout is top-level `it:` / `en:`
# objects. Ours is per-field `{ it, en }` (see src/content/). Map that as object
# widgets so a save round-trips the YAML the site already loads.

backend:
  name: github
  repo: rednaw/anticobagliosiciliano
  branch: main
  skip_ci: false
  base_url: https://auth.tientjeketama.nl
  auth_methods: [oauth]

site_url: https://rednaw.github.io/anticobagliosiciliano
display_url: https://rednaw.github.io/anticobagliosiciliano

output:
  omit_empty_optional_fields: true

# Uploads go here. YAML stores public_folder paths (`/images/…`).
media_folder: static/images
public_folder: /images

collections:
  - name: pages
    label: Pagine
    editor:
      preview: false
    files:
      - name: home
        label: Home
        file: src/content/pages/home.yml
        format: yaml
        media_folder: '{{media_folder}}/ambiance'
        public_folder: '{{public_folder}}/ambiance'
        fields:
          - name: title
            label: Titolo
            widget: object
            collapsed: true
            fields: &it-en-string
              - { name: it, label: Italiano, widget: string }
              - { name: en, label: English, widget: string }
          - name: brand
            label: Marchio
            widget: object
            fields:
              - name: name
                label: Nome
                widget: string
              - name: tagline
                label: Tagline (resta in italiano)
                widget: string
              - name: description
                label: Descrizione (SEO)
                widget: object
                collapsed: true
                fields: &it-en-text
                  - { name: it, label: Italiano, widget: text }
                  - { name: en, label: English, widget: text }
          - name: portone
            label: Portone
            widget: object
            fields:
              - name: lead
                label: Sottotitolo
                widget: object
                collapsed: true
                fields: *it-en-text
              - { name: wide, label: Largo, widget: image }
              - { name: tall, label: Alto, widget: image }
              - { name: alt, label: Testo alternativo, widget: object, collapsed: true, fields: *it-en-string }
          - name: video
            label: Video
            widget: object
            collapsed: true
            fields:
              - { name: alt, label: Testo alternativo, widget: object, collapsed: true, fields: *it-en-string }
          - name: chiSiamo
            label: Chi siamo
            widget: object
            fields:
              - { name: title, label: Titolo, widget: object, collapsed: true, fields: *it-en-string }
              - { name: body, label: Testo, widget: object, collapsed: true, fields: *it-en-text }
          - name: houses
            label: Case (blocco)
            widget: object
            fields:
              - { name: eyebrow, label: Sopratitolo, widget: object, collapsed: true, fields: *it-en-string }
              - { name: title, label: Titolo, widget: object, collapsed: true, fields: *it-en-string }
              - { name: lead, label: Intro, widget: object, collapsed: true, fields: *it-en-text }
              - { name: more, label: Link, widget: object, collapsed: true, fields: *it-en-string }
          - name: cortile
            label: Cortile
            widget: object
            fields:
              - { name: image, label: Foto, widget: image }
              - { name: alt, label: Testo alternativo, widget: object, collapsed: true, fields: *it-en-string }
              - { name: eyebrow, label: Sopratitolo, widget: object, collapsed: true, fields: *it-en-string }
              - { name: title, label: Titolo, widget: object, collapsed: true, fields: *it-en-string }
              - { name: lead, label: Intro, widget: object, collapsed: true, fields: *it-en-text }
              - { name: body, label: Testo, widget: object, collapsed: true, fields: *it-en-text }
          - name: giardino
            label: Giardino
            widget: object
            fields:
              - { name: image, label: Foto giardino, widget: image }
              - { name: alt, label: Testo alternativo giardino, widget: object, collapsed: true, fields: *it-en-string }
              - { name: agrumeto, label: Foto agrumeto, widget: image }
              - { name: agrumetoAlt, label: Testo alternativo agrumeto, widget: object, collapsed: true, fields: *it-en-string }
              - { name: eyebrow, label: Sopratitolo, widget: object, collapsed: true, fields: *it-en-string }
              - { name: title, label: Titolo, widget: object, collapsed: true, fields: *it-en-string }
              - name: paragraphs
                label: Testo
                widget: object
                hint: Riga vuota = nuovo paragrafo.
                fields: *it-en-text
          - name: places
            label: Imperdibili (blocco)
            widget: object
            fields:
              - { name: title, label: Titolo, widget: object, collapsed: true, fields: *it-en-string }
              - { name: lead, label: Intro, widget: object, collapsed: true, fields: *it-en-text }
          - name: cta
            label: Invito
            widget: object
            fields:
              - { name: title, label: Titolo, widget: object, collapsed: true, fields: *it-en-string }
              - { name: body, label: Testo, widget: object, collapsed: true, fields: *it-en-text }

      - name: amenities
        label: Servizi
        file: src/content/pages/amenities.yml
        format: yaml
        fields:
          - { name: eyebrow, label: Sopratitolo, widget: object, collapsed: true, fields: *it-en-string }
          - { name: title, label: Titolo, widget: object, collapsed: true, fields: *it-en-string }
          - name: items
            label: Servizi
            widget: list
            summary: "{{title.it}}"
            fields:
              - { name: title, label: Titolo, widget: object, collapsed: true, fields: *it-en-string }
              - { name: detail, label: Dettaglio, widget: object, collapsed: true, fields: *it-en-string }

