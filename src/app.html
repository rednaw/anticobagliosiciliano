<!doctype html>
<html lang="it">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0e3a47" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Figtree:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<!-- Restore unlock before first paint (avoids flash of gate / content). -->
		<script>
			(function () {
				try {
					if (new URLSearchParams(location.search).has('gate')) return;
					if (localStorage.getItem('abs-site-access') === 'ok') {
						document.documentElement.setAttribute('data-access', 'ok');
					}
				} catch (e) {}
			})();
		</script>
		<style>
			/* Returning visitors: hide gate shell until the app hydrates the real site. */
			html[data-access='ok'] .gate-screen {
				display: none !important;
			}
		</style>
		<noscript>
			<style>
				.reveal {
					opacity: 1 !important;
					transform: none !important;
				}
			</style>
		</noscript>
		<!-- hostname must match SIMPLE_ANALYTICS_HOSTNAME in src/lib/site-config.ts -->
		<script
			async
			defer
			src="https://scripts.simpleanalyticscdn.com/latest.js"
			data-hostname="anticobagliosiciliano.rednaw.github.io"
		></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
