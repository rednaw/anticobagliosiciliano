name: Casa 2
tagline:
  it: Intima e raffinata, perfetta per coppie o piccole famiglie
  en: Intimate and refined, perfect for couples or small families
summary:
  it: Circa 65 mq su due livelli con camera al piano terra, soppalco e terrazza. Ideale per una coppia o 3–4 persone.
  en: About 65 square meters on two levels, with the bedroom on the ground floor, a loft and a terrace. Ideal for a couple or 3–4 people.
guests:
  it: 2–4 ospiti
  en: 2/4 persons
bedrooms:
  it: 1 camera + soppalco
  en: 1 bedroom + mezzanine
bathrooms:
  it: 1 bagno
  en: 1 bathroom
paragraphs:
  it: |-
    La casa è disposta su due livelli per un totale di circa 65 mq. L’ingresso
    dà su un’ampia zona pranzo con una bella cucina a vista, comoda e
    organizzata. Sempre al piano terra si trova la stanza da letto, spaziosa e
    luminosa, con due grandi finestre affacciate su un magnifico uliveto. Il
    letto matrimoniale (160 x 200) lascia spazio ad un eventuale terzo letto o a
    un lettino per bambini (entrambi su richiesta). Accanto alla camera si trova
    un bagno con doccia, spazioso ed elegante.

    Una scala in muratura porta al soppalco dove si apre la zona soggiorno,
    eventualmente utilizzabile come seconda camera da letto per 2/3 persone. Vi
    si trova infatti un divano letto (140x 200) e vi è spazio per un eventuale
    letto supplementare.

    Da qui si accede a un bel terrazzo (15 mq) sui tetti del Baglio dove potrete
    fare colazione col primo sole del mattino, prendere il sole in totale
    privacy o godervi il fresco della sera.

    La casa si affaccia sul cortile del Baglio e nello spazio riservato
    antistante è possibile rilassarsi su una sdraio o cenare a lume di candela.

    La casa è frutto di un recente restauro: l’utilizzo di materiali di
    recupero, come antiche pietre e ringhiere, e la scelta di utilizzare cotto
    fatto a mano per i pavimenti e travi grezze di castagno per i soffitti,
    danno all’ambiente uno charme particolare. La casa ha un impianto di
    riscaldamento che la rende confortevole anche per un soggiorno invernale.

    Sistemazione ideale per una coppia, per una famiglia di 3/4 persone, per due
    coppie di amici.
  en: |-
    The house is on two floors and covers about 65 square meters. The entrance
    opens onto a large dining area with a nice kitchen, comfortable and
    organized. Also on the ground floor is the bedroom, spacious and bright,
    with two large windows overlooking a magnificent olive grove. The double bed
    (160 x 200) allows for a third bed or cot (both on request). Next to the
    bedroom is a spacious and elegant bathroom with a shower.

    A stone staircase leads to the mezzanine where you find the living area,
    also usable as a second bedroom for 2/3 people. There is a sofa bed (140x
    200) and enough space for an extra bed.

    This area leads to a lovely terrace (15 sq m) on the roofs of the baglio
    where you can have breakfast with the morning sun, sunbathe in privacy or
    enjoy the cool of the evening.

    The house overlooks the courtyard of the baglio and in the reserved space in
    front of it you can relax on a sun lounger or dine by candlelight.

    The house is the result of a recent restoration using recycled materials
    such as ancient stones and railings, and the choice of handmade terracotta
    for the floors and chestnut beams for the ceilings, give it a particular
    charm. The house has a heating system that makes it comfortable even for a
    winter stay.

    Perfect for a couple, for a family of 3/4 persons, or for two couples.
highlights:
  - it: Terrazza sull’uliveto (15 mq)
    en: Terrace overlooking the olive grove (15 sq m)
  - it: Cucina attrezzata
    en: Equipped kitchen
  - it: Riscaldamento e aria condizionata
    en: Heating and air conditioning
  - it: Wi‑Fi gratuito
    en: Free Wi‑Fi
