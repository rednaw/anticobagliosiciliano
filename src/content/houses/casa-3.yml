paragraphs:
  it: |-
    Questa pittoresca casa di campagna è disposta su due piani, per un totale di
    oltre 110 mq. Al piano terra un ampio e confortevole soggiorno con zona
    ingresso dà accesso alla zona notte. Qui si trovano tre camere da letto,
    tutte spaziose e luminose: due con letto matrimoniale e una terza con due
    letti singoli. Due camere si affacciano su un magnifico uliveto, la terza
    sul cortile del Baglio. Il divano letto del soggiorno può inoltre ospitare
    due persone.

    Una suggestiva scala in pietra lavica e ferro porta al primo piano, dove si
    aprono un secondo soggiorno e la zona cucina/pranzo. La cucina, bella e
    comoda, è dotata di forno. Dalla zona giorno si accede a un delizioso
    terrazzo (15 mq) affacciato sull’uliveto, dove si può cenare la sera o
    rilassarsi su una sdraio in totale privacy.

    L’ingresso della casa si affaccia sul cortile del Baglio: nello spazio
    riservato antistante gli ospiti possono godersi la piacevole atmosfera del
    cortile.

    La casa è frutto di un recente e accurato restauro: l’utilizzo di materiali
    di recupero, la scelta di cotto fatto a mano per i pavimenti, di pietra
    lavica per la scala e per la cucina e di travi grezze di legno per i
    soffitti, danno all’ambiente uno charme particolare. La casa ha un impianto
    di riscaldamento che la rende confortevole anche per un soggiorno invernale.

    Sistemazione ideale per una famiglia di 4/8 persone, per due/tre coppie di
    amici, per due famiglie.
  en: |-
    This picturesque country house is on two floors and covers a total of over
    110 square meters making it ideal accommodation for a family of 4/8 persons,
    for two/three couples, or for two families. On the ground floor is a large
    and comfortable living room and hall space which gives access to the
    sleeping area of the house. Here there are three bedrooms, all bright and
    spacious: two with a double bed and a third with two single beds. Two of the
    bedrooms overlook a magnificent olive grove and the third looks out onto the
    courtyard of the Baglio. In addition, the sofa bed in the living room can
    accommodate two people.

    A striking lava rock and iron staircase leads to the first floor. Here there
    is a second living room and the kitchen/dining area. The kitchen is both
    stylish and comfortable, and is equipped with an oven. From the
    living/dining area you can access a charming terrace of 15 sqm overlooking
    the olive grove. Here you can dine in the evening or relax on a sun lounger
    in absolute privacy.

    The entrance of the house overlooks the courtyard of the Baglio. Guests can
    here use the space reserved for their exclusive use and enjoy the charming
    atmosphere of the courtyard.

    The house has recently benefitted from an extensive restoration which
    employed recycled materials and specially chosen, handmade terracotta tiles
    for the floors, lava stone for the staircase and kitchen, and rustic wooden
    beams for the ceilings. All of these features give the house a unique charm.
    In addition, the house has a heating system that makes it comfortable for
    even a winter stay.
