title:
  it: Home
  en: Home
brand:
  name: Antico Baglio Siciliano
  tagline: Case vacanze in Sicilia
  description:
    it: Quattro case vacanze in un antico baglio a Balestrate, Sicilia. Cortile, agrumeto e
      uliveto; a pochi minuti da Segesta e lo Zingaro.
    en: Four holiday houses in a historic baglio in Balestrate, Sicily. Courtyard, citrus
      and olive groves; minutes from Segesta and the Zingaro.
portone:
  lead:
    it: Nel cuore della Sicilia occidentale, un’esperienza vera di relax e cultura.
    en: In the heart of western Sicily, a genuine experience of rest and culture.
  wide: /images/ambiance/hero-portone-wide.jpg
  tall: /images/ambiance/hero-portone-tall.jpg
  alt:
    it: Portone dell’Antico Baglio Siciliano immerso nel verde
    en: The gate of Antico Baglio Siciliano surrounded by greenery
video:
  alt:
    it: Il Baglio ripreso dall’alto
    en: The baglio seen from above
chiSiamo:
  title:
    it: Chi siamo
    en: About us
  body:
    it: Antico Baglio Siciliano è una struttura ricettiva immersa nella natura e nella
      storia della Sicilia occidentale. Offriamo un’accoglienza autentica, con ambienti
      confortevoli e un’atmosfera rilassante.
    en: Antico Baglio Siciliano is a place to stay surrounded by the nature and the history
      of western Sicily. We offer a genuine welcome, with comfortable spaces and a
      restful atmosphere.
houses:
  eyebrow:
    it: I nostri alloggi
    en: Accommodation
  title:
    it: Quattro case indipendenti, un solo cortile
    en: Four independent houses, one courtyard
  lead:
    it: Ogni casa ha il suo carattere. Tutte condividono il cuore del baglio e il giardino
      siciliano.
    en: Each house has its own character. All of them share the heart of the baglio and the
      Sicilian garden.
  more:
    it: Scopri la casa
    en: See the house
cortile:
  image: /images/ambiance/cortile.jpg
  alt:
    it: Cortile interno del baglio
    en: The inner courtyard of the baglio
  eyebrow:
    it: Il cortile
    en: The courtyard
  title:
    it: Il cuore del nostro baglio
    en: The heart of our baglio
  lead:
    it: Lo spazio perfetto per momenti indimenticabili con famiglia e amici.
    en: The perfect space for unforgettable moments with family and friends.
  body:
    it: L’ampio cortile interno, affacciato da tutti gli appartamenti, offre un ambiente
      unico dove gruppi di famiglie e amici possono stare insieme senza rinunciare alla
      privacy. Pranzi all’aperto, giochi per i bambini, serate sotto le stelle — in
      un’atmosfera autentica siciliana.
    en: The large inner courtyard, which all the houses overlook, is a space where groups of
      families and friends can be together without giving up their privacy. Lunches in
      the open air, games for the children, evenings under the stars — in a genuinely
      Sicilian atmosphere.
giardino:
  image: /images/ambiance/giardino.jpg
  alt:
    it: Tettoia e sdraio affacciate sul giardino del baglio
    en: Canopy and sun loungers looking onto the baglio garden
  agrumeto: /images/ambiance/agrumeto.jpg
  agrumetoAlt:
    it: Agrumeto del baglio con aranci in frutto
    en: The baglio citrus grove with orange trees in fruit
  eyebrow:
    it: Il giardino
    en: The garden
  title:
    it: Vivi il nostro giardino siciliano
    en: Enjoy our Sicilian garden
  paragraphs:
    it: |-
      Il cuore dell’Antico Baglio Siciliano è la natura che lo circonda: un
      autentico agrumeto e un uliveto secolare avvolgono la struttura, regalando
      profumi, ombra e silenzio.

      Tra gli alberi si apre una zona relax sotto una grande tettoia antica, dove
      puoi leggere, riposare su una sdraio o condividere momenti speciali con chi
      ami.

      A disposizione anche un’area barbecue perfetta per cene all’aperto, tra il
      verde e la pietra viva del nostro baglio.
    en: |-
      The heart of Antico Baglio Siciliano is the nature around it: a real citrus
      grove and a centuries-old olive grove wrap around the houses, giving scent,
      shade and silence.

      Among the trees there is a quiet corner under a large old canopy, where you
      can read, rest on a sun lounger or share special moments with the people you
      love.

      There is also a barbecue area, perfect for dinners outdoors among the
      greenery and the bare stone of our baglio.
places:
  title:
    it: Un buon punto per esplorare
    en: A good base for exploring
  lead:
    it: Antichi templi, arte, riserve naturali, borghi medievali e la costa — tutto vicino.
    en: Ancient temples, art, nature reserves, medieval towns and the coast — all close by.
cta:
  title:
    it: Pronto per la Sicilia?
    en: Ready for Sicily?
  body:
    it: Scrivici per disponibilità e preventivo. Ti rispondiamo con cura, come ai nostri
      ospiti.
    en: Write to us for availability and a quote. We answer with the same care we give our
      guests.
