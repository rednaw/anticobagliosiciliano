title:
  it: Privacy
  en: Privacy
metaDescription:
  it: "Informativa privacy dell’Antico Baglio Siciliano: come trattiamo i dati di chi
    visita il sito o ci scrive."
  en: "Privacy notice for Antico Baglio Siciliano: how we handle data from people who
    visit the site or write to us."
lead:
  it: Questa pagina spiega in modo sintetico quali dati riguardano chi visita il sito o ci
    chiede disponibilità.
  en: This page explains, in short, what data is involved when you visit the site or ask
    about availability.
groupContact:
  it: Quando ci scrivi
  en: When you contact us
groupBrowse:
  it: Quando visiti il sito
  en: When you browse the site
controllerTitle:
  it: Titolare
  en: Controller
controller:
  it: Il titolare del trattamento è Antico Baglio Siciliano. Puoi scriverci a
  en: The data controller is Antico Baglio Siciliano. You can write to us at
contact:
  it: "Il modulo contatti non invia i dati a un server: apre il tuo programma di posta con
    un messaggio già compilato (nome, email, alloggio, date, numero di ospiti e
    l’eventuale testo). Riceviamo solo ciò che ci invii tu. Usiamo questi dati per
    rispondere e organizzare il soggiorno, e non li cediamo a terzi per marketing."
  en: "The contact form does not post data to a server: it opens your email program with a
    message already filled in (name, email, accommodation, dates, number of guests, and
    any note). We only receive what you send us. We use it to reply and arrange the
    stay, and we do not pass it to third parties for marketing."
analyticsTitle:
  it: Statistiche di visita
  en: Visit statistics
analytics:
  it: "Contiamo quante persone visitano il sito e quali pagine guardano, così capiamo se
    le informazioni sono chiare. Non sappiamo chi sei: niente nome, email o un identikit
    da pubblicità. Per questo usiamo Simple Analytics. "
  en: "We count how many people visit the site and which pages they look at, so we can
    tell whether the information is clear. We do not know who you are: no name, email,
    or advertising profile. That is why we use Simple Analytics. "
analyticsPolicy:
  it: Vedi quali dati vengono raccolti
  en: See what data is collected
cookiesTitle:
  it: Cookie
  en: Cookies
cookies:
  it: Non usiamo cookie — né di profilazione, né di marketing, né di statistica — e non lo
    fanno nemmeno i servizi descritti qui sotto.
  en: We do not use cookies — not for profiling, marketing, or analytics — and neither do
    the services described below.
hostingTitle:
  it: Ospitalità del sito
  en: Site hosting
hosting:
  it: "Il sito è pubblicato come pagine statiche su GitHub Pages. Eventuali log tecnici di
    accesso li tratta GitHub, non noi. Vedi la "
  en: "The site is published as static pages on GitHub Pages. Any technical access logs
    are processed by GitHub, not by us. See the "
hostingPolicy:
  it: nota di GitHub Pages sulla raccolta dati
  en: GitHub Pages note on data collection
mapsTitle:
  it: Mappa
  en: Map
maps:
  it: Sulla pagina Come arrivare la mappa chiede le immagini a OpenStreetMap. Il browser
    si collega ai loro server; OpenStreetMap può vedere l’indirizzo IP di chi guarda
    quella pagina. Vedi l’
  en: "On the Getting here page the map loads images from OpenStreetMap. Your browser
    connects to their servers; OpenStreetMap may see the IP address of people who view
    that page. See the "
mapsPolicy:
  it: informativa sulla privacy di OpenStreetMap
  en: OpenStreetMap privacy policy
weatherTitle:
  it: Meteo
  en: Weather
weather:
  it: Sulla pagina Come arrivare, quando la connessione lo consente, il browser chiede le
    condizioni attuali al baglio a Open-Meteo (solo le coordinate pubbliche del luogo).
    Il browser si collega ai loro server; Open-Meteo può vedere l’indirizzo IP di chi fa
    la richiesta. Vedi l’
  en: "On the Getting here page, when the connection allows it, the browser requests
    current conditions at the baglio from Open-Meteo (only the place’s public
    coordinates). Your browser connects to their servers; Open-Meteo may see the IP
    address of whoever makes the request. See the "
weatherPolicy:
  it: informativa sulla privacy di Open-Meteo
  en: Open-Meteo privacy policy
rightsTitle:
  it: I tuoi diritti
  en: Your rights
rights:
  it: "Per i messaggi che ci hai inviato puoi chiedere di leggerli, correggerli o
    cancellarli, scrivendo all’indirizzo sopra. Non possiamo accedere ai log di GitHub
    Pages né a visite individuali in Simple Analytics: per quelli valgono le informative
    dei fornitori. Puoi presentare reclamo al Garante per la protezione dei dati
    personali."
  en: "For messages you have sent us, you can ask us to read, correct, or delete them by
    writing to the address above. We cannot access GitHub Pages logs or individual
    Simple Analytics visits: those sit with the providers’ own policies. You can lodge a
    complaint with the Italian Data Protection Authority (Garante)."
