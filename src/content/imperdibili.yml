title:
  it: Imperdibili
  en: Nearby
meta:
  it: Segesta, Zingaro, Monreale, Palermo, Selinunte, le Saline di Trapani ed Erice — a
    pochi minuti dall’Antico Baglio Siciliano.
  en: Segesta, Zingaro, Monreale, Palermo, Selinunte, the Trapani salt pans and Erice — a
    few minutes from Antico Baglio Siciliano.
lead:
  it: Grazie alla sua ottima posizione, si possono raggiungere facilmente alcuni dei più
    bei luoghi di mare e d’arte della Sicilia Occidentale.
  en: From the baglio you can easily reach some of the most beautiful stretches of coast
    and the finest art in western Sicily.
